<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@filter/lens 本地测试</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }
    h1 {
      color: white;
      text-align: center;
    }
    .info {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>@filter/lens 本地测试</h1>
    <div class="info">
      <p><strong>使用说明：</strong></p>
      <ul>
        <li>如果使用 npm link，确保已运行 <code>npm link</code></li>
        <li>如果使用相对路径，确保已运行 <code>npm run build</code></li>
        <li>点击下面的按钮测试不同的透镜效果</li>
        <li>可以直接拖动创建的透镜元素</li>
      </ul>
    </div>
    <div class="button-group">
      <button onclick="addGlass()">添加 Glass</button>
      <button onclick="addFisheye()">添加 Fisheye</button>
      <button onclick="addKaleidoscope()">添加 Kaleidoscope</button>
      <button onclick="addReadingGlass()">添加 ReadingGlass</button>
      <button onclick="addCylindrical()">添加 Cylindrical</button>
      <button onclick="addSpherical()">添加 Spherical</button>
      <button onclick="addPrism()">添加 Prism</button>
      <button onclick="addPrismGrid()">添加 PrismGrid</button>
      <button onclick="addRandom()">添加 Random</button>
      <button onclick="clearAll()">清除所有</button>
    </div>
  </div>

  <script type="module">
    // 方式 1: 使用 npm link（推荐）
    // import { Glass, FisheyeLens, KaleidoscopeLens, ReadingGlass, CylindricalLens, SphericalLens, PrismLens, PrismGridLens, RandomLens } from "@filter/lens";
    
    // 方式 2: 使用相对路径（适合直接打开此文件）
    import { Glass, FisheyeLens, KaleidoscopeLens, ReadingGlass, CylindricalLens, SphericalLens, PrismLens, PrismGridLens, RandomLens } from "../dist/index.js";

    let lensCount = 0;

    window.addGlass = () => {
      const el = Glass.createDraggable({
        width: 250,
        height: 180,
        radius: 18,
        depth: 12,
        strength: 110,
        chromaticAberration: 6,
        blur: 3,
        initialX: 100 + lensCount * 30,
        initialY: 150 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.addFisheye = () => {
      const el = FisheyeLens.createDraggable({
        width: 200,
        height: 200,
        borderRadius: '50%',
        distortion: 1.5,
        edgeSoftness: 0.2,
        initialX: 150 + lensCount * 30,
        initialY: 200 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.addKaleidoscope = () => {
      const el = KaleidoscopeLens.createDraggable({
        width: 250,
        height: 250,
        structure: 'triangular',
        angle: 60,
        segments: 6,
        initialX: 200 + lensCount * 30,
        initialY: 250 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.addReadingGlass = () => {
      const el = ReadingGlass.createDraggable({
        width: 150,
        height: 150,
        borderRadius: '50%',
        magnification: 2.5,
        blur: 8,
        initialX: 250 + lensCount * 30,
        initialY: 300 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.addCylindrical = () => {
      const el = CylindricalLens.createDraggable({
        width: 200,
        height: 150,
        direction: 'horizontal',
        curvature: 0.8,
        initialX: 300 + lensCount * 30,
        initialY: 350 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.addSpherical = () => {
      const el = SphericalLens.createDraggable({
        width: 180,
        height: 180,
        borderRadius: '50%',
        curvature: 0.7,
        chromaticAberration: 4,
        initialX: 350 + lensCount * 30,
        initialY: 400 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.addPrism = () => {
      const el = PrismLens.createDraggable({
        width: 200,
        height: 200,
        angle: 45,
        separation: 12,
        initialX: 400 + lensCount * 30,
        initialY: 450 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.addPrismGrid = () => {
      const el = PrismGridLens.createDraggable({
        width: 250,
        height: 250,
        cellSize: 30,
        separation: 8,
        initialX: 450 + lensCount * 30,
        initialY: 500 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.addRandom = () => {
      const el = RandomLens.createDraggable({
        width: 200,
        height: 200,
        intensity: 15,
        grainSize: 8,
        initialX: 500 + lensCount * 30,
        initialY: 550 + lensCount * 30,
      });
      document.body.appendChild(el);
      lensCount++;
    };

    window.clearAll = () => {
      document.querySelectorAll('[data-lens]').forEach(el => el.remove());
      lensCount = 0;
    };

    console.log('✅ @filter/lens 加载成功！');
    console.log('可用模块:', { Glass, FisheyeLens, KaleidoscopeLens, ReadingGlass, CylindricalLens, SphericalLens, PrismLens, PrismGridLens, RandomLens });
  </script>
</body>
</html>
