<!-- First layer: original background -->
<use href="#backgroundLayer"/>

<!-- Second layer: filter effect layer (applied only to circular area, circle in mask will move) -->
<g filter="url(#glassFilter)" mask="url(#circleMask)">
  <use href="#backgroundLayer"/>
</g>

<!-- Third layer: circular stroke (foreground, follows the circle in mask) -->
